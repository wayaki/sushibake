<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WAYAKI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin-spin.css">
</head>
<body>
<main class="admin-page">

  <section
    id="admin-login"
    class="admin-login-card"
  >

    <h1>WAYAKI Admin</h1>

    <label for="admin-email">
      Email
    </label>

    <input
      id="admin-email"
      type="email"
      autocomplete="email"
    >

    <label for="admin-password">
      Password
    </label>

    <input
      id="admin-password"
      type="password"
      autocomplete="current-password"
    >

    <button
      id="admin-login-btn"
      type="button"
    >
      Log In
    </button>

    <p
      id="login-message"
      aria-live="polite"
    ></p>

  </section>

</main>

<script
  type="module"
  src="../js/admin/login.js"
></script>
</body>
</html>
