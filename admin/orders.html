<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>WAYAKI Orders</title>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Global CSS -->
    <link
      rel="stylesheet"
      href="../css/global.css"
    />

    <!-- Orders CSS -->
    <link
      rel="stylesheet"
      href="../css/admin/orders.css"
    />
  </head>

  <body>

    <!-- ================================================
         ADMIN HEADER
    ================================================= -->

    <header>

      <!-- ========================
           ADMIN BRAND
      ======================== -->

      <div class="admin-brand">

        <a href="../admin/orders.html">

          <img
            class="logo"
            src="../images/logo.png"
            alt="WAYAKI Logo"
          />

        </a>

        <span class="admin-badge">
          Admin
        </span>

      </div>


      <!-- ========================
           ADMIN NAVIGATION
      ======================== -->

      <nav class="nav-links">

        <!-- Back to Store -->

        <a
          href="../index.html"
          class="back-store-link"
          aria-label="Back to store"
        >

          <img
            class="store"
            src="../images/store.png"
            alt="Store"
          />

        </a>


        <!-- Logout -->

        <button
          type="button"
          id="admin-logout-btn"
          class="admin-logout-btn"
          aria-label="Logout"
        >

          <img
            class="logout"
            src="../images/logout.png"
            alt="Logout"
          />

        </button>

      </nav>

    </header>


    <!-- ================================================
         MAIN ORDERS PAGE
    ================================================= -->

    <main class="orders-page">


      <!-- ================================================
           SG61 ADMIN SHORTCUT
      ================================================= -->

      <div class="sg61-lucky-draw">

        <a
          href="../admin/admin-spin.html"
          class="sg61-link"
        >

          <img
            class="sg61-mascot"
            src="../images/wheel/sg61-mascot.png"
            alt="SG61"
          />

          <span>
            SG61 Admin
          </span>

        </a>

      </div>


      <!-- ================================================
           ORDER SUMMARY
      ================================================= -->

      <section class="order-summary">


        <!-- Pending -->

        <div class="summary-card">

          <span
            id="pending-count"
            class="summary-number"
          >
            0
          </span>

          <span class="summary-label">
            Pending
          </span>

        </div>


        <!-- Confirmed -->

        <div class="summary-card">

          <span
            id="confirmed-count"
            class="summary-number"
          >
            0
          </span>

          <span class="summary-label">
            Confirmed
          </span>

        </div>


        <!-- Completed -->

        <div class="summary-card">

          <span
            id="completed-count"
            class="summary-number"
          >
            0
          </span>

          <span class="summary-label">
            Completed
          </span>

        </div>

      </section>


      <!-- ================================================
           ORDER FILTERS
      ================================================= -->

      <section class="orders-toolbar">


        <!-- ========================
             STATUS TABS
        ======================== -->

        <div class="status-tabs">

          <button
            type="button"
            class="status-tab active"
            data-status="pending"
          >
            Pending
          </button>


          <button
            type="button"
            class="status-tab"
            data-status="confirmed"
          >
            Confirmed
          </button>


          <button
            type="button"
            class="status-tab"
            data-status="completed"
          >
            Completed
          </button>


          <button
            type="button"
            class="status-tab"
            data-status="cancelled"
          >
            Cancelled
          </button>


          <button
            type="button"
            class="status-tab"
            data-status="all"
          >
            All
          </button>

        </div>


        <!-- ========================
             SEARCH
        ======================== -->

        <div class="orders-search">

          <input
            type="search"
            id="order-search"
            placeholder="Search order, name or phone"
            autocomplete="off"
          />

        </div>

      </section>


      <!-- ================================================
           ORDERS HEADING
      ================================================= -->

      <section class="orders-heading">

        <div>

          <h2 id="orders-list-title">
            Pending Orders
          </h2>

          <p id="orders-list-description">
            Orders waiting for confirmation.
          </p>

        </div>

      </section>


      <!-- ================================================
           PAGE MESSAGES
      ================================================= -->

      <!-- Loading -->

      <div
        id="orders-loading"
        class="orders-message"
      >
        Loading orders...
      </div>


      <!-- Error -->

      <div
        id="orders-error"
        class="orders-message error-message"
        hidden
      >
        Unable to load orders.
      </div>


      <!-- Empty -->

      <div
        id="orders-empty"
        class="orders-message"
        hidden
      >
        No orders found.
      </div>


      <!-- ================================================
           ORDER LIST
           orders.js renders compact order cards here
      ================================================= -->

      <section
        id="orders-list"
        class="orders-list"
      >
      </section>

    </main>


    <!-- ================================================
         ORDER DETAIL MODAL
    ================================================= -->

    <div
      id="order-modal"
      class="order-modal hidden"
      aria-hidden="true"
    >

      <!-- ========================
           BACKDROP
      ======================== -->

      <div
        class="order-modal-backdrop"
        data-close-order-modal
      >
      </div>


      <!-- ========================
           MODAL CARD
      ======================== -->

      <div
        class="order-modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="order-modal-title"
      >

        <!-- ========================
             CLOSE BUTTON
        ======================== -->

        <button
          type="button"
          id="close-order-modal"
          class="modal-close-btn"
          aria-label="Close order"
        >
          ✕
        </button>

      </div>

    </div>

    <!-- ================================================
         ADMIN ORDERS JS
    ================================================= -->

    <script
      type="module"
      src="../js/admin/orders.js"
    ></script>

  </body>
</html>
