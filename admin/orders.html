<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>WAYAKI Orders</title>

  <!-- Global CSS -->
  <link
    rel="stylesheet"
    href="../css/global.css"
  >

  <!-- Orders CSS -->
  <link
    rel="stylesheet"
    href="../css/admin/orders.css"
  >
</head> 


<body>

  <!-- ================================================
       ADMIN HEADER
  ================================================= -->

  <header>
      <div class="admin-brand">
        <a href="../admin/orders.html">
          <img class="logo" src="../images/logo.png" alt="WAYAKI Logo">
        </a>
        <span class="admin-badge">
          Admin
        </span>
      </div>

      <nav class="nav-links">
      <a
        href="../index.html"
        class="back-store-link"
      >
        <img class="store" src="../images/store.png" alt="Store">
      </a>

      <button
        type="button"
        id="admin-logout-btn"
        class="admin-logout-btn"
        >
        <img class="logout" src="../images/logout.png" alt="Logout">
      </button>
    </nav>

  </header>


  <!-- ================================================
       MAIN
  ================================================= -->

  <main class="orders-page">

    <div class="sg61-lucky-draw">
      <a
        href="../admin/admin-spin.html"
        class="sg61-link"
      >
        <img class="sg61-mascot" src="../images/wheel/sg61-mascot.png" alt="SG61">
        <span>SG61 Admin</span>
      </a>
    </div>

    <!-- ========================
         ORDER SUMMARY
    ========================= -->

    <section class="order-summary">

      <div class="summary-card">
        <span
          id="pending-count"
          class="summary-number"
        >
          0
        </span>

        <span class="summary-label">
          Pending
        </span>
      </div>


      <div class="summary-card">
        <span
          id="confirmed-count"
          class="summary-number"
        >
          0
        </span>

        <span class="summary-label">
          Confirmed
        </span>
      </div>


      <div class="summary-card">
        <span
          id="completed-count"
          class="summary-number"
        >
          0
        </span>

        <span class="summary-label">
          Completed
        </span>
      </div>

    </section>


    <!-- ========================
         FILTERS
    ========================= -->

    <section class="orders-toolbar">

      <div class="status-tabs">

        <button
          type="button"
          class="status-tab active"
          data-status="pending"
        >
          Pending
        </button>

        <button
          type="button"
          class="status-tab"
          data-status="confirmed"
        >
          Confirmed
        </button>

        <button
          type="button"
          class="status-tab"
          data-status="completed"
        >
          Completed
        </button>

        <button
          type="button"
          class="status-tab"
          data-status="cancelled"
        >
          Cancelled
        </button>

        <button
          type="button"
          class="status-tab"
          data-status="all"
        >
          All
        </button>

      </div>


      <div class="orders-search">

        <input
          type="search"
          id="order-search"
          placeholder="Search order, name or phone"
        >

      </div>

    </section>


    <!-- ========================
         ORDERS HEADER
    ========================= -->

    <section class="orders-heading">

      <div>
        <h2 id="orders-list-title">
          Pending Orders
        </h2>

        <p id="orders-list-description">
          Orders waiting for confirmation.
        </p>
      </div>

    </section>


    <!-- ========================
         LOADING
    ========================= -->

    <div
      id="orders-loading"
      class="orders-message"
    >
      Loading orders...
    </div>


    <!-- ========================
         ERROR
    ========================= -->

    <div
      id="orders-error"
      class="orders-message error-message"
      hidden
    >
      Unable to load orders.
    </div>


    <!-- ========================
         EMPTY
    ========================= -->

    <div
      id="orders-empty"
      class="orders-message"
      hidden
    >
      No orders found.
    </div>


    <!-- ========================
         ORDER LIST
         orders.js will render cards here
    ========================= -->

    <section
      id="orders-list"
      class="orders-list"
    >
    </section>


  </main>


  <!-- ================================================
       ORDER DETAIL MODAL
       We will use this later for View / Edit
  ================================================= -->

  <div
    id="order-modal"
    class="order-modal hidden"
  >

    <div class="order-modal-backdrop"></div>

    <div class="order-modal-card">

      <button
        type="button"
        id="close-order-modal"
        class="modal-close-btn"
        aria-label="Close order"
      >
        ✕
      </button>


      <div
        id="order-modal-content"
        class="order-modal-content"
      >
      </div>

    </div>

  </div>


  <!-- ================================================
       JS
  ================================================= -->

  <script
    type="module"
    src="../js/admin/orders.js"
  ></script>

</body>

</html>
