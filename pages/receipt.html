<!doctype html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <title>WAYAKI Order Receipt</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />


  <!-- Google Font -->

  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&display=swap"
    rel="stylesheet"
  />


  <!-- CSS -->

  <link
    rel="stylesheet"
    href="../css/global.css"
  />

  <link
    rel="stylesheet"
    href="../css/receipt.css"
  />

</head>


<body>


  <!-- ================================================
       HEADER
  ================================================= -->

  <header>

    <a
      href="https://wayaki.github.io/sushibake/"
    >

      <img
        class="logo"
        src="../images/logo.png"
        alt="WAYAKI Logo"
      />

    </a>

  </header>



  <!-- ================================================
       RECEIPT PAGE
  ================================================= -->

  <main class="receipt-page">


    <!-- ========================
         SUCCESS HEADER
    ======================== -->

    <section class="receipt-success">

      <div class="success-icon">
        🧡
      </div>

      <h1>
        Order Submitted!
      </h1>

      <p>
        Thank you for ordering with WAYAKI.
      </p>

    </section>



    <!-- ========================
         RECEIPT CARD
    ======================== -->

    <section
      class="receipt-card"
      id="receipt-card"
    >


      <!-- ORDER NUMBER -->

      <div class="receipt-order-number">

        <span>
          Order No.
        </span>

        <strong
          id="receipt-order-number"
        >
          -
        </strong>

      </div>



      <!-- ========================
           ORDER DETAILS
      ======================== -->

      <div class="receipt-section">

        <h2>
          Order Details
        </h2>


        <div class="receipt-row">

          <span>
            Name
          </span>

          <strong
            id="receipt-name"
          >
            -
          </strong>

        </div>


        <div class="receipt-row">

          <span>
            Date
          </span>

          <strong
            id="receipt-date"
          >
            -
          </strong>

        </div>


        <div class="receipt-row">

          <span>
            Time
          </span>

          <strong
            id="receipt-time"
          >
            -
          </strong>

        </div>


        <div class="receipt-row">

          <span>
            Collection
          </span>

          <strong
            id="receipt-method"
          >
            -
          </strong>

        </div>

      </div>



      <!-- ========================
           ITEMS
      ======================== -->

      <div class="receipt-section">

        <h2>
          Your Order
        </h2>

        <div
          id="receipt-items"
          class="receipt-items"
        >
        </div>

      </div>



      <!-- ========================
           PAYMENT
      ======================== -->

      <div class="receipt-section">

        <div class="receipt-row">

          <span>
            Payment
          </span>

          <strong
            id="receipt-payment"
          >
            -
          </strong>

        </div>


        <div
          class="receipt-row total-row"
        >

          <span>
            Total
          </span>

          <strong
            id="receipt-total"
          >
            $0.00
          </strong>

        </div>

      </div>


        <!-- ================================================
        PAYMENT PROOF
        ================================================ -->

        <div
        id="receipt-proof-section"
        class="receipt-proof-section"
        style="display: none"
        >
        <p class="receipt-proof-title">
            Payment Proof
        </p>

        <img
            id="receipt-proof-image"
            class="receipt-proof-image"
            alt="Payment proof"
        />

        <button
            type="button"
            id="view-proof-btn"
            class="view-proof-btn"
        >
            View Payment Proof
        </button>
        </div>


      <!-- ========================
           PAYMENT STATUS
      ======================== -->

      <div
        id="payment-status"
        class="payment-status"
      >
      </div>


    </section>



    <!-- ========================
         NEXT STEP
    ======================== -->

    <section class="receipt-next-step">

      <h2>
        One last step 🧡
      </h2>

      <p
        id="receipt-next-message"
      >
        Send your order to us on WhatsApp
        so we can confirm it.
      </p>


      <button
        id="send-whatsapp-btn"
        class="whatsapp-btn"
        type="button"
      >
        Send Order to WhatsApp
      </button>

    </section>



    <!-- ========================
         NEW ORDER
    ======================== -->

    <button
      id="new-order-btn"
      class="new-order-btn"
      type="button"
    >
      Start New Order
    </button>


  </main>



  <!-- ================================================
       JAVASCRIPT
  ================================================= -->

  <script
    type="module"
    src="../js/checkout/receipt.js"
  ></script>


</body>

</html>
