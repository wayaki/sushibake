<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WAYAKI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/cart.css" />
  </head>
  <body>
    <header>
      <a href="https://wayaki.github.io/sushibake/">
        <img class="logo" src="../images/logo.png" alt="WAYAKI Logo" />
      </a>

      <div class="header-right">
        <!-- Instagram -->
        <a
          class="ig-link"
          href="https://www.instagram.com/wayaki.sushibake/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="WAYAKI Instagram"
        >
          <img class="ig-logo" src="../images/ig-logo-mascot.png" alt="" />
        </a>

        <!-- Navigation -->
        <nav class="nav-links">
          <a href="https://wayaki.github.io/sushibake/" class="linked">
            Menu
          </a>

          <a href="https://wayaki.github.io/sushibake/pages/cart.html">
            Cart
          </a>
        </nav>
      </div>
    </header>

    <div class="container">
      <!-- ORDER DETAILS -->
      <!-- Shows all selected items from cart -->
      <div class="section-title">
        <h2>Order Details</h2>
      </div>

      <div class="cart-item">
        <ul id="cart-list"></ul>
      </div>
    </div>

<!-- Sticky checkout summary -->
<div class="checkout-bar">

  <div class="price-line">
    <span>Subtotal</span>
    <span>
      $<span id="subtotal-price">0.00</span>
    </span>
  </div>
  
  <button
    type="button"
    id="checkout-btn"
  >
    Continue
  </button>

</div>

    <!-- JavaScript -->
    <script src="../js/cart/cart.js"></script>
    <script src="../js/cart/render.js"></script>
    <script type="module" src="../js/cart/order.js"></script>
    <script src="../js/cart/init.js"></script>
  </body>
</html>
